# ==============================================================================
# AMIT AI CONCIERGE — RENDER FREE BLUEPRINT SPECIFICATION
# Official Enterprise Hospitality Platform Deployment for Amit Hospitality
# Reference: https://amithospitality.com/
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Backend API Service (FastAPI + Python 3.12 + SQLAlchemy)
  # ----------------------------------------------------------------------------
  - type: web
    name: amit-concierge-api
    runtime: python
    region: frankfurt # or oregon / singapore
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    # Pre-boot migration with PostgreSQL advisory lock, followed by empirically validated 1 Uvicorn worker (106.9MB peak RSS, 79.1% headroom on 512MB RAM limit)
    startCommand: "cd backend && python run_migrations.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1"
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: "Amit AI Concierge"
      - key: DEBUG
        value: "false"
      - key: DEFAULT_ENVIRONMENT
        value: DEMO
      - key: DATABASE_URL
        fromDatabase:
          name: amit-concierge-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: OTP_HMAC_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: INITIAL_ADMIN_EMAIL
        value: admin@amithospitality.com
      - key: INITIAL_ADMIN_PASSWORD
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "https://amit-concierge-ui.onrender.com,https://amithospitality.com,https://*.amithospitality.com"
      - key: UPLOAD_DIR
        value: "./uploads"
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SENDGRID_API_KEY
        sync: false

  # ----------------------------------------------------------------------------
  # 2. Frontend Web Client (React + TypeScript + Vite + Tailwind CSS)
  # ----------------------------------------------------------------------------
  - type: web
    name: amit-concierge-ui
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /widget.js
        name: Access-Control-Allow-Origin
        value: "*"
    envVars:
      - key: VITE_API_BASE_URL
        value: https://amit-concierge-api.onrender.com

# ------------------------------------------------------------------------------
# 3. Managed PostgreSQL Database with pgvector Extension
# ------------------------------------------------------------------------------
databases:
  - name: amit-concierge-postgres
    region: frankfurt
    plan: free
    databaseName: amit_concierge
    user: amit_admin
    ipAllowList: [] # internal Render network access
